<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" preserveAspectRatio="xMidYMid slice" role="presentation">
  <defs>
    <radialGradient id="warm" cx="30%" cy="28%" r="85%">
      <stop offset="0%" stop-color="#FCF8F1"/>
      <stop offset="55%" stop-color="#F6ECDC"/>
      <stop offset="100%" stop-color="#EFE0CC"/>
    </radialGradient>
    <linearGradient id="clay" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E2A07F" stop-opacity="0.55"/>
      <stop offset="100%" stop-color="#B85C38" stop-opacity="0.35"/>
    </linearGradient>
    <linearGradient id="sage" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0%" stop-color="#9CA88B" stop-opacity="0.45"/>
      <stop offset="100%" stop-color="#6F7E5F" stop-opacity="0.25"/>
